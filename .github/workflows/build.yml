name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        run: unzip -q BybitScanner-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Собрать APK
        run: gradle -p BybitScanner assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bybit-scanner-apk
          path: BybitScanner/app/build/outputs/apk/debug/app-debug.apk
